[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "annotator-cli"
version = "1.0.0"
description = "Annotates source files with their relative paths for easier AI/debug context"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pathspec>=1.0.4",
]
license = { text = "MIT" }

[project.scripts]
annotator = "annotator.cli:main"

[tool.setuptools]
packages = ["annotator"]
include-package-data = true

[tool.setuptools.package-data]
annotator = ["templates/*.json"]

[dependency-groups]
dev = [
    "poethepoet>=0.41.0",
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "python-semantic-release>=10.5.3",
    "ruff>=0.15.2",
]

[tool.poe.tasks]
test = "pytest"
test-cov = "pytest --cov=annotator tests/ --cov-report=term-missing"
check = "ruff check ."
fix = "ruff check --fix ."
format = "ruff format ."
clean = """
rm -rf .venv .ruff_cache .pytest_cache .coverage htmlcov dist build *.egg-info
"""
lint = ["fix", "format"]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
branch = "master"
build_command = "uv build"
commit_message = "chore(release): {version} [skip ci]"
